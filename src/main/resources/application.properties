spring.config.import=optional:file:.env[.properties]
spring.application.name=finpay

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/finpay}
spring.datasource.username=${DB_USERNAME:finpay}
spring.datasource.password=${DB_PASSWORD:finpay_dev}

spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=finpay
spring.flyway.default-schema=finpay

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

finpay.security.jwt.secret=${JWT_SECRET}
finpay.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}

# Demo session provisioning is opt-in and creates isolated, fictitious accounts.
finpay.demo.enabled=${FINPAY_DEMO_ENABLED:false}
finpay.demo.funded-amount=${FINPAY_DEMO_FUNDED_AMOUNT:10000.00}
finpay.demo.rate-limit.max-sessions=${FINPAY_DEMO_RATE_LIMIT_MAX_SESSIONS:10}
finpay.demo.rate-limit.window=${FINPAY_DEMO_RATE_LIMIT_WINDOW:PT1H}

# Optional local demo users. Disabled unless explicitly enabled in the local .env.
finpay.bootstrap.enabled=${FINPAY_BOOTSTRAP_ENABLED:false}
finpay.bootstrap.admin.email=${FINPAY_BOOTSTRAP_ADMIN_EMAIL:}
finpay.bootstrap.admin.password=${FINPAY_BOOTSTRAP_ADMIN_PASSWORD:}
finpay.bootstrap.user.email=${FINPAY_BOOTSTRAP_USER_EMAIL:user@finpay.local}
finpay.bootstrap.user.password=${FINPAY_BOOTSTRAP_USER_PASSWORD:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
