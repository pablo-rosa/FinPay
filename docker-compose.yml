name: finpay

services:
  postgres:
    image: postgres:17-alpine
    container_name: finpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finpay}
      POSTGRES_USER: ${POSTGRES_USER:-finpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finpay_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finpay} -d ${POSTGRES_DB:-finpay}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
